generator:
  class:              sfPropelAdminGenerator
  param:
    model_class:      Usuario
    theme:            default
    edit:
         display: [usuario_id, user_name, fecha_inicio, fecha_fin, usuario_cargo] 
         fields:
           user_name:         { type: plain }
           fecha_inicio:      { type: plain }
           fecha_fin:         { type: plain }
           usuario_cargo:     { type: admin_double_list, params: through_class=CargoUsuario }